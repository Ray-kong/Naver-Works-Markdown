<div id="wrap" class="works_talk skin_default_bg font_medium">
  <section class="section_rgt">
    <div class="chat_box">
      <div id="chat_room_scroll" class="scroller">
        <div class="chat_view">
          <div class="msg_lft msg_wrap" data-for-copy='{"messageTime":1}' data-user-select="true">
            <div>
              <div class="chk_msg"><input type="checkbox"><label></label></div>
              <div class="msg_inr">
                <div class="msg_area">
                  <div class="msg_box">
                    <p class="msg hl_content"># 릴리스 안내<br><br>- 변경 사항 A<br>- 변경 사항 B</p>
                  </div>
                  <div class="status_box">
                    <button class="reaction"><span class="blind">reaction</span></button>
                    <button class="more_menu">show context menu</button>
                  </div>
                </div>
                <div class="mini_reaction_area"><div class="inner"></div></div>
              </div>
            </div>
          </div>
          <div class="msg_rgt msg_wrap connect_msg" data-for-copy='{"messageTime":2}' data-user-select="true">
            <div>
              <div class="chk_msg"><input type="checkbox"><label></label></div>
              <div class="msg_inr">
                <div class="msg_area">
                  <div class="msg_box"><p class="msg hl_content">회의 3시에 시작합니다</p></div>
                  <div class="status_box"><button class="more_menu">show context menu</button></div>
                </div>
                <div class="mini_reaction_area"><div class="inner"></div></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
